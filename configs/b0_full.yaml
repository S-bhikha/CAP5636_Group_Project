# Stage 1 (B0) -- full pretrain. Needs: python scripts/download_data.py (no --smoke-only)
# ~2x lab scale: 10L / 768d / 12H (~78M). If vocab_size differs from existing
# bpe_tokenizer/, retrain with --retrain-tokenizer.
run_id: b0_full_768
data: data/raw/tinystories/train.jsonl
val_data: data/raw/tinystories/validation.jsonl

vocab_size: 10000
# block_size is set by Stage 2, not Stage 1: the learned positional table is
# sized here and M2 cannot exceed it. M2 packs a rendered fact card + the whole
# gold story into ONE window. Measured on data/ (866 pairs, 100 eval prompts):
#   rendered prompt  median 161  max 223 tokens
#   gold story       median 194  max 254 tokens
#   worst prompt+story                461 tokens
# At 256 all 866 SFT examples were truncated mid-story (never seeing <eos>) and
# at eval the fact card scrolled out of the window mid-generation, so M2 was
# graded on facts it could no longer see. 640 fits the worst case and leaves
# 340 prompt tokens under FIXED_EVAL_DECODING.max_new_tokens=300, i.e. ~50%
# headroom over the measured max in case the real tokenizer splits
# encyclopedic terms more aggressively than the sample used to measure.
# Cost: 2.5x tokens/step vs 256 (16 x 640 = 10240). Halve batch_size to 8 to
# keep the original Stage-1 token budget.
block_size: 640
n_layer: 10
n_head: 12
n_embd: 768
dropout: 0.10
pos_encoding: learned

batch_size: 16
max_steps: 10000
lr: 0.0003
warmup_steps: 250
weight_decay: 0.1

# Cap tokenization time on the ~2M-row full file; raise/remove for a bigger budget.
max_tokenize_tokens: 80000000

eval_every: 200
gen_every: 1000
ckpt_every: 2000
seed: 0
