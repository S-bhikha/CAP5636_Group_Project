# Stage 2 (M2): SFT on (fact card + prompt) -> story pairs from the B0 checkpoint.
# Keep batch_size + max_steps identical to configs/b1_cpt.yaml -- matched
# Stage-2 token budget is a course/README requirement, not optional.
mode: sft
system_id: M2
run_id: m2_sft_full_768

# block_size is inherited from this checkpoint. It must fit the rendered fact
# card plus the whole gold story (461 tokens worst case, measured) or examples
# are truncated mid-story -- see configs/b0_full.yaml. Watch the startup log for
# a "[sft-data] WARNING: ... truncated" line; it should not appear.
init_ckpt: results/b0_full_768/checkpoint.pt

fact_cards: data/fact_cards/train.jsonl
eval_cards: data/fact_cards/eval.jsonl
sft_pairs: data/sft_pairs/train.jsonl
templates: data/prompts/templates.json

batch_size: 16
max_steps: 3000
lr: 0.00005
warmup_steps: 150
weight_decay: 0.1

eval_every: 100
gen_every: 250
ckpt_every: 250
seed: 0
